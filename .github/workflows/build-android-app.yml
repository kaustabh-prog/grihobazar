# Compiles the Grihobazar Android app on GitHub's machines, so no Android Studio
# and no Android SDK are needed on your own computer.
#
# HOW TO RUN IT
#   Actions tab → "Build Android app" → "Run workflow"
#   When it finishes, open the run and download from the "Artifacts" box.
#
# WHAT YOU GET
#   grihobazar-debug-apk   — install on your phone to test. Always built.
#   grihobazar-release-aab — upload to Play Console. Needs the four secrets below.
#
# FOR THE AAB, add these under
# Settings → Secrets and variables → Actions → New repository secret:
#   KEYSTORE_BASE64      the whole contents of keystore-base64.txt (one long line)
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            grihobazar
#   KEY_PASSWORD         the same password
# Without them the AAB job skips itself and the debug APK still builds.
#
# GETTING THE PROJECT IN HERE
#   You can either upload the project files themselves, or just upload the
#   project ZIP and let this workflow unpack it — it handles both, and finds the
#   project whether it sits at the repository root or in a subfolder.

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '**/*.gradle'
      - '**/src/**'
      - '**/gradle/wrapper/**'
      - '**/*.zip'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK (installable for testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project and check it is complete
        id: proj
        run: |
          find_settings() {
            find . -path ./.git -prune -o \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print 2>/dev/null | head -1
          }

          found=$(find_settings)
          if [ -z "$found" ]; then
            zip=$(find . -path ./.git -prune -o -name '*.zip' -print 2>/dev/null | head -1)
            if [ -n "$zip" ]; then
              echo "No project files in the repository, but found $zip — unpacking it."
              unzip -q -o "$zip" -d _unpacked
              found=$(find_settings)
            fi
          fi
          if [ -z "$found" ]; then
            echo "::error::No Android project here. Upload the project files, or upload the project .zip and this will unpack it."
            exit 1
          fi

          dir=$(dirname "$found"); dir=${dir#./}; [ -z "$dir" ] && dir=.
          echo "Android project root: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

          missing=0
          for f in settings.gradle build.gradle gradle.properties gradlew \
                   gradle/wrapper/gradle-wrapper.jar \
                   gradle/wrapper/gradle-wrapper.properties \
                   app/build.gradle \
                   app/src/main/AndroidManifest.xml; do
            if [ -e "$dir/$f" ]; then
              echo "  ok       $f"
            else
              echo "  MISSING  $f"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::The files marked MISSING above are not present. Upload the complete project (or its .zip) and run this again."
            exit 1
          fi

          # gradle.properties can be present but missing the one line the build
          # cannot start without, so check the setting rather than just the file.
          if ! grep -q '^android.useAndroidX=true' "$dir/gradle.properties"; then
            echo "::error::gradle.properties is missing 'android.useAndroidX=true'. Gradle refuses to build AndroidX dependencies without it."
            exit 1
          fi
          echo "  ok       android.useAndroidX=true" 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Uploading through GitHub's web page, or unzipping, loses the executable
      # flag on gradlew — restore it or the build fails with "Permission denied".
      - name: Make gradlew executable
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Compile the debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grihobazar-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-aab:
    name: Signed release AAB (for Play Console)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether signing secrets are present
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set, so the release AAB was skipped. The debug APK still built."
          fi

      - name: Find the project
        if: steps.signing.outputs.ready == 'true'
        id: proj
        run: |
          find_settings() {
            find . -path ./.git -prune -o \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print 2>/dev/null | head -1
          }

          found=$(find_settings)
          if [ -z "$found" ]; then
            zip=$(find . -path ./.git -prune -o -name '*.zip' -print 2>/dev/null | head -1)
            if [ -n "$zip" ]; then
              echo "Unpacking $zip"
              unzip -q -o "$zip" -d _unpacked
              found=$(find_settings)
            fi
          fi
          if [ -z "$found" ]; then
            echo "::error::No Android project here."
            exit 1
          fi

          dir=$(dirname "$found"); dir=${dir#./}; [ -z "$dir" ] && dir=.
          echo "Android project root: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.signing.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Make gradlew executable
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Compile and sign the AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          GB_STORE_FILE: ${{ runner.temp }}/upload.jks
          GB_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grihobazar-release-aab
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore from the runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
